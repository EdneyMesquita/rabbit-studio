<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rabbit Studio</title>
    <style>
      /* Until the app's stylesheet loads: the editor tone of the saved theme. */
      html { background: #1e1f22; }
      html[data-theme="light"] { background: #ffffff; }
      #splash {
        position: fixed; inset: 0; display: grid; place-items: center;
        font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #8b8e98;
      }
      #splash > div { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: splash-in 240ms ease-out 120ms both; }
      #splash svg { width: 56px; height: 56px; }
      #splash i { display: block; width: 96px; height: 2px; border-radius: 1px; overflow: hidden; background: rgb(139 142 152 / 0.2); }
      #splash i::after { content: ""; display: block; width: 40%; height: 100%; background: #3574f0; animation: splash-bar 1.1s ease-in-out infinite; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(4px); } }
      @keyframes splash-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash > div, #splash i::after { animation: none; } }
    </style>
    <script>
      // Same key as src/lib/themes.ts, so the splash matches the app.
      try {
        if (localStorage.getItem("rabbit-studio-theme") === "light") document.documentElement.dataset.theme = "light";
      } catch {}
    </script>
  </head>

  <body>
    <!-- React replaces the splash when it mounts. -->
    <div id="root">
      <div id="splash" role="status" aria-label="Loading Rabbit Studio">
        <div>
          <svg viewBox="0 0 1024 1024" aria-hidden="true">
            <defs>
              <linearGradient id="sb" x1="512" y1="180" x2="512" y2="820" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#FFB27A" />
                <stop offset="1" stop-color="#E8590C" />
              </linearGradient>
            </defs>
            <rect width="1024" height="1024" rx="200" fill="#191c25" />
            <g transform="translate(14 22)">
              <rect x="606" y="196" width="88" height="250" rx="34" fill="#C2460A" transform="rotate(-8 650 440)" />
              <rect x="508" y="170" width="96" height="290" rx="36" fill="url(#sb)" transform="rotate(-16 556 440)" />
              <rect x="536" y="212" width="40" height="190" rx="20" fill="#FFE2C8" opacity=".7" transform="rotate(-16 556 440)" />
              <g fill="url(#sb)">
                <rect x="494" y="372" width="290" height="250" rx="64" />
                <rect x="236" y="498" width="470" height="292" rx="96" />
                <rect x="196" y="560" width="96" height="96" rx="40" />
                <rect x="626" y="722" width="150" height="68" rx="30" />
              </g>
              <rect x="672" y="444" width="56" height="56" rx="14" fill="#7A2C05" opacity=".85" />
              <rect x="760" y="528" width="24" height="26" rx="10" fill="#7A2C05" opacity=".7" />
            </g>
          </svg>
          <i></i>
        </div>
      </div>
    </div>
    <script>
      // The window starts hidden (tauri.conf.json): show it now that the
      // splash is in the page, before the app's bundle has even loaded. Not
      // on an animation frame: a hidden window never paints, so it gets none.
      window.__TAURI_INTERNALS__?.invoke("plugin:window|show", { label: "main" }).catch(() => {});
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
