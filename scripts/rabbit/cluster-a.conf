# Cluster A (rabbitmq 4.2, two nodes). Mounted as conf.d so the image's
# default-user settings (RABBITMQ_DEFAULT_USER/PASS) are kept.
cluster_name = studio-dev-a
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit-a1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit-a2
